name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21 first, 17 last: the last JDK becomes the default
          # (JAVA_HOME) for the build; 21 exists so the unit-test
          # toolchain can run tests on it (see app/build.gradle.kts).
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint, unit tests, debug APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: preview-md-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
