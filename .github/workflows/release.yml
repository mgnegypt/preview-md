name: Release

# Signed releases are built ONLY from version tags (see docs/RELEASING.md).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate the tag and compute the version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Tag $TAG is not vMAJOR.MINOR.PATCH[-beta.N]" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          if [[ "$VERSION" == *"-beta."* ]]; then
            PRE="${VERSION##*-beta.}"
            PRERELEASE=true
          else
            PRE=99
            PRERELEASE=false
          fi
          CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + PRE ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE)"

      - name: Check the signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          done
          exit $missing

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview-md-release.jks"

      - name: Build the signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/preview-md-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify the signature and name the assets
        id: assets
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          NAME="preview-md-${{ steps.version.outputs.version }}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" | awk '{print $1}' > "$NAME.sha256"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ steps.assets.outputs.apk }}"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" "$APK" "$APK.sha256" \
              --title "${GITHUB_REF_NAME}" --generate-notes --prerelease
          else
            gh release create "${GITHUB_REF_NAME}" "$APK" "$APK.sha256" \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
